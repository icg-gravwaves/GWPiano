[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gw-piano"
version = "0.1.0"
description = "A gravitational-wave-inspired sampled keyboard and static site generator"
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
dependencies = ["lalsuite>=7.26,<8", "numpy>=1.24,<3"]

[project.scripts]
gw-piano = "gw_piano.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gw_piano = ["web/*", "data/*.json"]
