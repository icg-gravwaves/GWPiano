<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><link rel="icon" type="image/svg+xml" href="gw-piano-mark.svg">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GW Piano · controls</title>
<link rel="stylesheet" href="theme.css">
<style>
  /* 7-inch touch screen in landscape (1280×720 at ~210 px/inch). Every size is in rem, and the root
     size follows the viewport, so text keeps the same physical size relative to the screen on any display. */
  html { font-size: min(4.2vh, 2.4vw); height: 100%; }
  body { height: 100%; margin: 0; box-sizing: border-box; padding: .55rem .8rem; user-select: none;
         color: var(--text); font: 1rem/1.25 var(--font-body);
         background: radial-gradient(ellipse at 20% 0%, var(--panel), transparent 60%),
                     radial-gradient(ellipse at 100% 100%, #00385066, transparent 55%), var(--bg);
         display: grid; grid-template-rows: auto 1.15fr 2fr auto; gap: .45rem; }
  button { font: inherit; font-weight: 700; border: 0; border-radius: .5rem; color: var(--on-accent); background: var(--accent);
           touch-action: manipulation; display: grid; place-content: center; gap: .1rem; padding: .25rem .4rem;
           transition: transform .08s, box-shadow .2s, opacity .2s; }
  button small { font-weight: 400; font-size: .6rem; opacity: .85; }
  button:active { transform: scale(.97); }
  button:disabled { opacity: .35; }
  [data-busy="true"] { box-shadow: 0 0 0 .12rem var(--white), 0 0 1.2rem var(--accent-glow); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 .12rem var(--white), 0 0 .3rem var(--accent-glow); } }
  .label { font-family: var(--font-heading); font-weight: var(--weight-heading); font-size: .55rem; letter-spacing: .1em;
           text-transform: uppercase; color: var(--accent-text); }

  /* Header: logo, live status, reset */
  header { display: flex; align-items: center; gap: .7rem; }
  header img { height: 1.5rem; width: auto; }
  #status { flex: 1; font-size: .62rem; color: var(--muted); display: flex; align-items: center; gap: .3rem; }
  #status::before { content: ""; width: .4rem; height: .4rem; border-radius: 50%; background: var(--line); }
  body[data-ready="true"] #status::before { background: var(--success); box-shadow: 0 0 .4rem var(--success); }
  #reset { background: transparent; color: var(--muted); border: .06rem solid var(--line); font-size: .58rem; font-weight: 600; padding: .3rem .6rem; }

  /* Sound mode: one segmented switch, the active half lit in its colour */
  #modes { display: grid; grid-template-columns: 1fr 1fr; gap: .3rem; padding: .3rem; border-radius: .7rem; background: var(--black); min-height: 0; }
  .mode { font-family: var(--font-heading); font-weight: var(--weight-heading); font-size: 1.25rem; letter-spacing: .04em;
          grid-template-columns: auto auto; align-items: center; column-gap: .6rem; }
  .mode svg { grid-row: span 2; width: 2.6rem; height: 1.3rem; }
  .mode small { font-family: var(--font-body); font-size: .6rem; text-align: left; }
  .mode[aria-pressed="false"] { background: transparent; color: var(--muted); }
  #mode-scientific[aria-pressed="true"] { background: var(--signal); color: var(--on-signal); box-shadow: 0 0 1.2rem var(--signal-glow); }
  #mode-musical[aria-pressed="true"] { background: var(--highlight); color: var(--black); box-shadow: 0 0 1.2rem #dcfd3544; }

  /* Notable detections: each tile carries a chirp drawn from the event's chirp mass */
  #landmarks { display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: 1fr 1fr; gap: .4rem; min-height: 0; }
  #landmarks button { background: linear-gradient(160deg, var(--surface), var(--panel)); color: var(--text);
                      border-left: .18rem solid var(--brand-blue-bright); place-content: stretch; text-align: left;
                      grid-template-rows: auto 1fr auto; padding: .3rem .45rem .35rem; overflow: hidden; }
  #landmarks .name { font-family: var(--font-heading); font-weight: var(--weight-heading); font-size: .72rem; color: var(--accent-text); }
  #landmarks svg { width: 100%; height: 100%; min-height: .8rem; }
  #landmarks small { justify-self: start; font-family: var(--font-note); font-weight: var(--weight-note); font-size: .6rem; line-height: 1.15;
                     color: var(--black); background: var(--highlight); padding: 0 .2rem; opacity: 1; transform: rotate(-1.5deg); }

  /* Bottom row: example tunes, the full catalogue, and stop */
  .actions { display: grid; grid-template-columns: 2.2fr 1.5fr 1fr .9fr; gap: .4rem; height: 2.6rem; }
  #tunes { display: grid; grid-template-columns: repeat(var(--n, 4), 1fr); gap: .25rem; padding: .2rem; border-radius: .5rem;
           background: var(--panel); position: relative; }
  #tunes button { background: var(--surface); color: var(--text); font-size: .6rem; padding: .2rem; }
  #tunes button::before { content: "♪"; display: block; color: var(--highlight-pink); font-size: .8rem; line-height: 1; }
  #detections { background: var(--brand-purple); font-size: .72rem; }
  #timeline { background: var(--surface); color: var(--text); font-size: .66rem; }
  #stop { background: var(--danger); color: var(--white); font-size: .8rem; }
</style>
</head>
<body>
  <header><img src="gw-piano-dark.svg" alt="GW Piano"><span id="status">Waiting for the live display…</span><button id="reset">Reset played notes</button></header>
  <div id="modes" role="group" aria-label="Sound mode">
    <button class="mode" id="mode-scientific" aria-pressed="true"><svg viewBox="0 0 100 40" aria-hidden="true"><path d="M0 20 Q6 10 12 20 T24 20 T34 20 T42 20 T49 20 T55 20 T60 20 T64 20 T68 20 T71 20 T74 20" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg>SCIENTIFIC<small>the full model waveform</small></button>
    <button class="mode" id="mode-musical" aria-pressed="false"><svg viewBox="0 0 100 40" aria-hidden="true"><path d="M30 34 V6 L70 2 V28" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/><ellipse cx="24" cy="34" rx="8" ry="6" fill="currentColor"/><ellipse cx="64" cy="29" rx="8" ry="6" fill="currentColor"/></svg>MUSICAL<small>chirp with a piano note</small></button>
  </div>
  <div id="landmarks"></div>
  <div class="actions">
    <div id="tunes" aria-label="Example tunes"></div>
    <button id="detections">▶ Play every detection<small>0.2 s apart, oldest first</small></button>
    <button id="timeline">Timeline<small>30 s, real spacing</small></button>
    <button id="stop">■ Stop</button>
  </div>
<script type="module">
import {tunes} from './tunes.mjs';
import {landmarks, chirpMass} from './landmarks.mjs';
const SVG = 'http://www.w3.org/2000/svg';
// Lighter binaries spend more cycles in band, so each tile's chirp gets more, tighter cycles for a lower chirp mass.
const chirpMasses = fetch('catalog.json').then(r => r.json())
  .then(catalog => Object.fromEntries(catalog.events.filter(e => e.masses?.length === 2).map(e => [e.name, chirpMass(e.masses)])))
  .catch(error => { console.debug('GW Piano controls: catalog unavailable, using default chirps', error); return {}; });
function chirpPath(mc = 30) {
  const cycles = Math.min(14, Math.max(3, 6 * (30 / mc) ** 0.4));
  let d = '';
  for (let i = 0; i <= 240; i++) {
    const t = i / 240, phase = 2 * Math.PI * cycles * (1 - (1 - t) ** (5 / 8));
    const amp = 7 * (0.25 + 0.75 * t ** 2) * (t > 0.97 ? Math.max(0, (1 - t) / 0.03) : 1);
    d += `${i ? 'L' : 'M'}${(t * 100).toFixed(1)},${(10 - amp * Math.sin(phase)).toFixed(2)}`;
  }
  return d;
}
function chirpIcon(name) {
  const svg = document.createElementNS(SVG, 'svg'), path = document.createElementNS(SVG, 'path');
  svg.setAttribute('viewBox', '0 0 100 20'); svg.setAttribute('preserveAspectRatio', 'none'); svg.setAttribute('aria-hidden', 'true');
  Object.entries({d: chirpPath(), fill: 'none', stroke: 'var(--brand-blue-bright)', 'stroke-width': 1.4, 'vector-effect': 'non-scaling-stroke'})
    .forEach(([k, v]) => path.setAttribute(k, v));
  chirpMasses.then(masses => { if (masses[name]) path.setAttribute('d', chirpPath(masses[name])); });
  svg.append(path);
  return svg;
}
const channel = new BroadcastChannel('gw-piano-kiosk');
const send = message => { console.debug('GW Piano controls send', message); channel.postMessage(message); };
const tuneRow = document.querySelector('#tunes');
tunes.forEach((tune, index) => {
  const button = document.createElement('button');
  button.textContent = tune.label; button.dataset.busyKey = `tune-${index}`;
  button.onclick = () => send({type: 'tune', index});
  tuneRow.append(button);
});
tuneRow.style.setProperty('--n', tunes.length);
const landmarkRow = document.querySelector('#landmarks');
landmarks.forEach((landmark, index) => {
  const button = document.createElement('button');
  button.append(Object.assign(document.createElement('span'), {className: 'name', textContent: landmark.label ?? landmark.name}),
    chirpIcon(landmark.name), Object.assign(document.createElement('small'), {textContent: landmark.title}));
  button.dataset.busyKey = `landmark-${index}`;
  button.onclick = () => send({type: 'landmark', index});
  landmarkRow.append(button);
});
document.querySelector('#detections').dataset.busyKey = 'detections';
document.querySelector('#timeline').dataset.busyKey = 'timeline';
document.querySelector('#mode-scientific').onclick = () => send({type: 'mode', mode: 'scientific'});
document.querySelector('#mode-musical').onclick = () => send({type: 'mode', mode: 'musical'});
document.querySelector('#detections').onclick = () => send({type: 'detections', condensed: false});
document.querySelector('#timeline').onclick = () => send({type: 'detections', condensed: true});
document.querySelector('#stop').onclick = () => send({type: 'stop'});
document.querySelector('#reset').onclick = () => send({type: 'reset'});
const playable = [...document.querySelectorAll('button')];
playable.forEach(button => { button.disabled = true; });
channel.onmessage = ({data}) => {
  if (data.type !== 'state') return;
  // The live display owns the state; this page mirrors it so the mode pad and touch screen agree.
  for (const mode of ['scientific', 'musical']) document.querySelector(`#mode-${mode}`).setAttribute('aria-pressed', String(data.mode === mode));
  for (const button of playable) {
    button.disabled = !data.ready;
    if (button.dataset.busyKey) button.dataset.busy = String(data.busy === button.dataset.busyKey);
  }
  document.body.dataset.ready = String(Boolean(data.ready));
  document.querySelector('#status').textContent = data.ready
    ? `Mode: ${data.mode}${data.busy ? ' · playing' : ''}`
    : 'Live display is loading sounds…';
};
send({type: 'hello'});
</script>
</body>
</html>
