<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GW Piano · controls</title>
<link rel="stylesheet" href="theme.css">
<style>
  /* Small touch screen in landscape (1280×720). Large targets; sends commands to kiosk-live.html. */
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 18px/1.3 Inter, system-ui, sans-serif; user-select: none;
         display: grid; grid-template-rows: auto 1.2fr auto .9fr auto .9fr auto 1.1fr auto; gap: 10px; padding: 18px 32px; box-sizing: border-box; }
  h2 { font-size: 18px; font-weight: 400; color: var(--muted); margin: 6px 0 0; }
  .row { display: grid; gap: 14px; min-height: 0; }
  button { font: inherit; font-weight: 700; border: 0; border-radius: 18px; color: var(--on-accent); background: var(--accent);
           touch-action: manipulation; display: grid; place-content: center; gap: 4px; }
  button small { font-weight: 400; font-size: 15px; }
  button:active { transform: scale(.98); }
  button:disabled { opacity: .4; }
  button[aria-pressed="false"].mode { background: var(--surface); color: var(--muted); outline: 3px solid var(--line); outline-offset: -3px; }
  #mode-scientific { font-size: 38px; } #mode-scientific[aria-pressed="true"] { background: var(--signal); color: var(--on-signal); }
  #mode-musical { font-size: 38px; } #mode-musical[aria-pressed="true"] { background: var(--warning); color: var(--on-signal); }
  [data-busy="true"] { outline: 4px solid var(--white); outline-offset: -4px; }
  #landmarks button { background: var(--surface); color: var(--text); font-size: 17px; padding: 4px 8px; }
  #landmarks button small { color: var(--muted); font-size: 13px; }
  #detections { background: var(--brand-purple); font-size: 26px; }
  #timeline { background: var(--surface); color: var(--text); font-size: 20px; }
  #stop { background: var(--danger); color: var(--on-signal); font-size: 28px; }
  .brand { display: flex; align-items: center; gap: 16px; } .brand img { height: 44px; width: auto; }
  footer { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 16px; }
  #reset { background: var(--surface); color: var(--muted); padding: 10px 28px; font-size: 17px; }
</style>
</head>
<body>
  <h2>Sound mode</h2>
  <div class="row" style="grid-template-columns:1fr 1fr">
    <button class="mode" id="mode-scientific" aria-pressed="true">SCIENTIFIC<small>full model waveform</small></button>
    <button class="mode" id="mode-musical" aria-pressed="false">MUSICAL<small>chirp + note tone</small></button>
  </div>
  <h2>Examples</h2>
  <div class="row" id="tunes" style="grid-template-columns:repeat(4,1fr)"></div>
  <h2>Notable detections</h2>
  <div class="row" id="landmarks" style="grid-template-columns:repeat(6,1fr)"></div>
  <h2>All LVK detections</h2>
  <div class="row" style="grid-template-columns:2fr 1fr 1fr">
    <button id="detections">▶ Play detections in order<small>0.2 s apart, oldest first</small></button>
    <button id="timeline">Detection timeline<small>30 s, real spacing</small></button>
    <button id="stop">■ Stop all</button>
  </div>
  <footer><span class="brand"><img src="gw-piano-dark.svg" alt="GW Piano" height="44"><span id="status">Waiting for the live display…</span></span><button id="reset">Reset played notes</button></footer>
<script type="module">
import {tunes} from './tunes.mjs';
import {landmarks} from './landmarks.mjs';
const channel = new BroadcastChannel('gw-piano-kiosk');
const send = message => { console.debug('GW Piano controls send', message); channel.postMessage(message); };
const tuneRow = document.querySelector('#tunes');
tunes.forEach((tune, index) => {
  const button = document.createElement('button');
  button.textContent = tune.label; button.dataset.busyKey = `tune-${index}`;
  button.onclick = () => send({type: 'tune', index});
  tuneRow.append(button);
});
const landmarkRow = document.querySelector('#landmarks');
landmarks.forEach((landmark, index) => {
  const button = document.createElement('button');
  button.append(landmark.title, Object.assign(document.createElement('small'), {textContent: landmark.name}));
  button.dataset.busyKey = `landmark-${index}`;
  button.onclick = () => send({type: 'landmark', index});
  landmarkRow.append(button);
});
document.querySelector('#detections').dataset.busyKey = 'detections';
document.querySelector('#timeline').dataset.busyKey = 'timeline';
document.querySelector('#mode-scientific').onclick = () => send({type: 'mode', mode: 'scientific'});
document.querySelector('#mode-musical').onclick = () => send({type: 'mode', mode: 'musical'});
document.querySelector('#detections').onclick = () => send({type: 'detections', condensed: false});
document.querySelector('#timeline').onclick = () => send({type: 'detections', condensed: true});
document.querySelector('#stop').onclick = () => send({type: 'stop'});
document.querySelector('#reset').onclick = () => send({type: 'reset'});
const playable = [...document.querySelectorAll('button')];
playable.forEach(button => { button.disabled = true; });
channel.onmessage = ({data}) => {
  if (data.type !== 'state') return;
  // The live display owns the state; this page mirrors it so the mode pad and touch screen agree.
  for (const mode of ['scientific', 'musical']) document.querySelector(`#mode-${mode}`).setAttribute('aria-pressed', String(data.mode === mode));
  for (const button of playable) {
    button.disabled = !data.ready;
    if (button.dataset.busyKey) button.dataset.busy = String(data.busy === button.dataset.busyKey);
  }
  document.querySelector('#status').textContent = data.ready
    ? `Mode: ${data.mode}${data.busy ? ' · playing' : ''}`
    : 'Live display is loading sounds…';
};
send({type: 'hello'});
</script>
</body>
</html>
