<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GW Piano · live</title>
<link rel="stylesheet" href="theme.css">
<style>
  /* Larger stand screen: timeseries, spectrogram and histogram stacked full-screen. Sizes are in rem and the
     root size follows the viewport, matching kiosk-controls.html, so the layout keeps its proportions on any monitor. */
  html { font-size: min(2.6vh, 1.5vw); height: 100%; }
  body { height: 100%; margin: 0; box-sizing: border-box; padding: .7rem 1.1rem; cursor: none;
         color: var(--text); font: 1rem/1.35 var(--font-body);
         background: radial-gradient(ellipse at 20% 0%, var(--panel), transparent 60%),
                     radial-gradient(ellipse at 100% 100%, #00385066, transparent 55%), var(--bg);
         display: grid; grid-template-rows: auto 1fr 1.3fr 1.2fr; gap: .6rem; }
  header { display: flex; align-items: center; gap: 1.2rem; }
  h1 { margin: 0; line-height: 0; } h1 img { height: 3rem; width: auto; }
  #last-note { flex: 1; font-size: 1.15rem; color: var(--muted); }
  /* Mode pill lit in the same colours as the mode switch on the touch screen */
  #mode-chip { text-transform: uppercase; font-family: var(--font-heading); font-weight: var(--weight-heading); font-size: 1.2rem;
               letter-spacing: .06em; padding: .35rem 1.1rem; border-radius: .7rem;
               background: var(--signal); color: var(--on-signal); box-shadow: 0 0 1.4rem var(--signal-glow); }
  #mode-chip[data-mode="musical"] { background: var(--highlight); color: var(--black); box-shadow: 0 0 1.4rem #dcfd3544; }
  .panel { background: linear-gradient(160deg, var(--surface), var(--panel)); border-left: .2rem solid var(--brand-blue-bright);
           border-radius: .6rem; padding: .5rem .9rem; display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; position: relative; }
  .panel h2 { font-family: var(--font-heading); font-weight: var(--weight-heading); font-size: .75rem; letter-spacing: .08em;
              text-transform: uppercase; color: var(--accent-text); margin: 0 0 .3rem; display: flex; justify-content: space-between; }
  .panel h2 span + span { font-family: var(--font-body); font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--muted); }
  canvas { width: 100%; height: 100%; display: block; min-height: 0; }
  #markers { position: absolute; inset: 1.65rem .9rem .5rem; pointer-events: none; }
  #markers span { position: absolute; bottom: 0; transform: translateX(-1px); border-left: 1px solid; padding-left: .3rem;
                  font-size: .7rem; height: 100%; display: flex; align-items: flex-end; white-space: nowrap; opacity: .9; }
  .scale { position: absolute; left: 1.2rem; top: 1.65rem; bottom: .5rem; display: flex; flex-direction: column; justify-content: space-between;
           font-size: .65rem; color: var(--muted); pointer-events: none; }
  /* min-height 0 lets the histogram shrink to its panel instead of keeping its viewBox aspect ratio */
  svg { width: 100%; height: 100%; min-height: 0; overflow: visible; }
  svg { font-size: .7rem; } svg text { fill: var(--muted); }
  #status { position: fixed; left: 50%; bottom: 40%; transform: translateX(-50%); margin: 0; padding: .6rem 1.4rem; border-radius: .7rem;
            background: var(--black); font-size: 1.1rem; color: var(--muted); display: flex; align-items: center; gap: .5rem; }
  #status::before { content: ""; width: .55rem; height: .55rem; border-radius: 50%; background: var(--highlight); animation: blink 1s infinite; }
  #status:empty { display: none; }
  @keyframes blink { 50% { opacity: .3; } }
</style>
</head>
<body>
  <header><h1><img src="gw-piano-dark.svg" alt="GW Piano" height="64"></h1><span id="last-note">Play a key</span><span id="mode-chip" data-mode="scientific">scientific</span></header>
  <section class="panel"><h2><span>Timeseries · strain (auto-scaled)</span><span>◀ last 4.5 s</span></h2>
    <canvas id="timeseries"></canvas><div id="markers"></div></section>
  <section class="panel"><h2><span>Spectrogram · frequency vs time</span><span>20 Hz – 2 kHz, log scale</span></h2>
    <canvas id="spectrogram"></canvas>
    <div class="scale" aria-hidden="true"><span>2 kHz</span><span>630 Hz</span><span>200 Hz</span><span>63 Hz</span><span>20 Hz</span></div></section>
  <section class="panel"><h2><span>Black-hole masses: LVK catalogue (blue) vs notes played (pink stripes)</span><span id="played-count"></span></h2>
    <svg id="histogram"></svg></section>
  <p id="status">Loading sounds…</p>
  <script type="module" src="kiosk.mjs"></script>
</body>
</html>
