<text x="487.0" y="360.7" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle" style="font-family:Inter,Helvetica,Arial,sans-serif">Example 2</text>
<rect x="644" y="298" width="290" height="110" rx="18" fill="#0078b4"/>
<text x="789.0" y="360.7" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle" style="font-family:Inter,Helvetica,Arial,sans-serif">Example 3</text>
<rect x="946" y="298" width="290" height="110" rx="18" fill="#0078b4"/>
<text x="1091.0" y="360.7" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle" style="font-family:Inter,Helvetica,Arial,sans-serif">Example 4</text>
