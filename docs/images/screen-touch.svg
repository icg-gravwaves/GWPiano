<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<rect width="1280" height="720" fill="#0f1218"/>
<text x="40" y="56" font-size="20" font-weight="400" fill="#b6bfcc" text-anchor="start" style="font-family:Inter,Helvetica,Arial,sans-serif">Sound mode</text>
<rect x="40" y="76" width="590" height="150" rx="18" fill="#2e253d" stroke="#5d6879" stroke-width="3"/>
<text x="335.0" y="149.0" font-size="40" font-weight="700" fill="#b6bfcc" text-anchor="middle" style="font-family:Inter,Helvetica,Arial,sans-serif">SCIENTIFIC</text>
<text x="335.0" y="179.0" font-size="17" font-weight="400" fill="#b6bfcc" text-anchor="middle" style="font-family:Inter,Helvetica,Arial,sans-serif">full model waveform</text>
<rect x="650" y="76" width="590" height="150" rx="18" fill="#ffc56e"/>
<text x="945.0" y="149.0" font-size="40" font-weight="700" fill="#0f1218" text-anchor="middle" style="font-family:Inter,Helvetica,Arial,sans-serif">MUSICAL</text>
<text x="945.0" y="179.0" font-size="17" font-weight="400" fill="#0f1218" text-anchor="middle" style="font-family:Inter,Helvetica,Arial,sans-serif">chirp + note tone  ✓</text>
<text x="40" y="280" font-size="20" font-weight="400" fill="#b6bfcc" text-anchor="start" style="font-family:Inter,Helvetica,Arial,sans-serif">Examples</text>
