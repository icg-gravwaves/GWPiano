<text x="335.0" y="543.0" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle" style="font-family:Inter,Helvetica,Arial,sans-serif">▶  Play detections in order</text>
<text x="335.0" y="573.0" font-size="17" font-weight="400" fill="#ffffff" text-anchor="middle" style="font-family:Inter,Helvetica,Arial,sans-serif">GW150914 → latest catalogued</text>
<rect x="650" y="480" width="290" height="60" rx="18" fill="#70ceff"/>
<text x="795.0" y="517.0" font-size="20" font-weight="700" fill="#0f1218" text-anchor="middle" style="font-family:Inter,Helvetica,Arial,sans-serif">In order</text>
<rect x="650" y="550" width="290" height="60" rx="18" fill="#2e253d" stroke="#5d6879" stroke-width="3"/>
<text x="795.0" y="587.0" font-size="20" font-weight="700" fill="#b6bfcc" text-anchor="middle" style="font-family:Inter,Helvetica,Arial,sans-serif">Preserve timeline</text>
<rect x="950" y="480" width="290" height="130" rx="18" fill="#ff8eac"/>
