<text x="40" y="680" font-size="18" font-weight="400" fill="#b6bfcc" text-anchor="start" style="font-family:Inter,Helvetica,Arial,sans-serif">Mode pad on the keyboard also switches mode · Reset played notes</text>
<rect x="1080" y="656" width="160" height="40" rx="12" fill="#2e253d" stroke="#5d6879"/>
