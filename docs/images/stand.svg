<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1420" height="1000" viewBox="0 0 1420 1000" style="font-family:Inter,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef0f6"/><stop offset="1" stop-color="#dfe2ec"/></linearGradient>
  </defs>
  <rect width="1420" height="1000" fill="url(#wall)"/>
  <rect y="880" width="1420" height="120" fill="#c9ccd8"/>
  <ellipse cx="420" cy="905" rx="330" ry="20" fill="#000" opacity=".08"/>
  <ellipse cx="1090" cy="905" rx="330" ry="20" fill="#000" opacity=".08"/>

  <!-- X-stand -->
  <path d="M190 880 L650 655 M650 880 L190 655" stroke="#3a3f4f" stroke-width="12" stroke-linecap="round"/>
  <path d="M160 880 h70 M610 880 h70" stroke="#3a3f4f" stroke-width="12" stroke-linecap="round"/>

  <!-- keyboard -->
  <rect x="90" y="590" width="660" height="78" rx="10" fill="#1d1f27"/>
  <g fill="#3a3f4f"><rect x="106" y="602" width="18" height="18" rx="3"/><rect x="130" y="602" width="18" height="18" rx="3"/><rect x="154" y="602" width="18" height="18" rx="3"/><rect x="178" y="602" width="18" height="18" rx="3"/><rect x="130" y="626" width="18" height="18" rx="3"/><rect x="154" y="626" width="18" height="18" rx="3"/><rect x="178" y="626" width="18" height="18" rx="3"/></g>
  <rect x="106" y="626" width="18" height="18" rx="3" fill="#ffc56e"/>
  <rect x="210" y="618" width="528" height="44" fill="#f4f6f9"/>
  <g id="oct" stroke="#9aa0b0" stroke-width="1.5">
    <line x1="228" y1="618" x2="228" y2="662"/><line x1="246" y1="618" x2="246" y2="662"/><line x1="264" y1="618" x2="264" y2="662"/><line x1="282" y1="618" x2="282" y2="662"/><line x1="300" y1="618" x2="300" y2="662"/><line x1="318" y1="618" x2="318" y2="662"/><line x1="336" y1="618" x2="336" y2="662"/>
  </g>
  <use href="#oct" x="126"/><use href="#oct" x="252"/><use href="#oct" x="378"/>
  <g id="blk" fill="#1d1f27"><rect x="222" y="618" width="10" height="26"/><rect x="240" y="618" width="10" height="26"/><rect x="276" y="618" width="10" height="26"/><rect x="294" y="618" width="10" height="26"/><rect x="312" y="618" width="10" height="26"/></g>
  <use href="#blk" x="126"/><use href="#blk" x="252"/><use href="#blk" x="378"/>

  <!-- headphones on a hook on the X-stand -->
  <path d="M620 700 v40" stroke="#3a3f4f" stroke-width="5"/>
  <path d="M595 780 a25 28 0 0 1 50 0" fill="none" stroke="#2a2d38" stroke-width="7"/>
  <rect x="586" y="772" width="16" height="26" rx="6" fill="#2a2d38"/><rect x="638" y="772" width="16" height="26" rx="6" fill="#2a2d38"/>

  <!-- side table -->
  <rect x="780" y="660" width="620" height="18" rx="3" fill="#8a6a4a"/>
  <path d="M800 678 V880 M1380 678 V880" stroke="#6e5238" stroke-width="12" stroke-linecap="round"/>

  <!-- monitor on its own foot, speakers either side -->
  <rect x="1135" y="642" width="120" height="12" rx="4" fill="#2a2d38"/>
  <rect x="1185" y="598" width="20" height="48" fill="#2a2d38"/>
  <rect x="1055" y="404" width="280" height="196" rx="10" fill="#111"/>
  <image href="screen-waveform.svg" x="1065" y="414" width="260" height="176" preserveAspectRatio="none"/>
  <g>
    <rect x="995" y="584" width="52" height="76" rx="9" fill="#2a2d38"/>
    <circle cx="1021" cy="602" r="8" fill="#15171e" stroke="#4a4f60" stroke-width="3"/>
    <circle cx="1021" cy="634" r="16" fill="#15171e" stroke="#4a4f60" stroke-width="3"/>
    <rect x="1343" y="584" width="52" height="76" rx="9" fill="#2a2d38"/>
    <circle cx="1369" cy="602" r="8" fill="#15171e" stroke="#4a4f60" stroke-width="3"/>
    <circle cx="1369" cy="634" r="16" fill="#15171e" stroke="#4a4f60" stroke-width="3"/>
  </g>

  <!-- touch screen in its case and stand, Pi on its back -->
  <path d="M850 660 L870 600" stroke="#4a4f60" stroke-width="10" stroke-linecap="round"/>
  <ellipse cx="850" cy="657" rx="34" ry="6" fill="#4a4f60"/>
  <g transform="rotate(-12 900 560)">
    <rect x="812" y="522" width="176" height="112" rx="8" fill="#5a5f70"/>
    <rect x="820" y="530" width="160" height="96" rx="4" fill="#111"/>
    <image href="screen-touch.svg" x="824" y="534" width="152" height="88" preserveAspectRatio="none"/>
  </g>

  <!-- callouts -->
  <g font-size="22" fill="#2a2d38">
    <text x="1195" y="364" text-anchor="middle" font-weight="700">Monitor or TV</text>
    <text x="1195" y="390" text-anchor="middle" fill="#5a6078">timeseries · spectrogram · histogram</text>
    <text x="790" y="380" text-anchor="middle" font-weight="700">Touch screen</text>
    <text x="790" y="406" text-anchor="middle" fill="#5a6078">mode · examples · detections</text>
    <path d="M820 416 L870 515" stroke="#5a6078" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="822" y="745" fill="#5a6078">Pi 5 in the case behind it</text>
    <path d="M850 725 L856 662" stroke="#5a6078" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="20" y="720" fill="#5a6078">mode pad (optional)</text>
    <path d="M100 700 L112 646" stroke="#5a6078" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="1195" y="700" text-anchor="middle" fill="#5a6078">speakers either side of the monitor</text>
    <text x="662" y="800" fill="#5a6078">headphones</text>
    <text x="420" y="950" text-anchor="middle" fill="#5a6078">49-key MIDI keyboard on an X-stand</text>
    <text x="1090" y="950" text-anchor="middle" fill="#5a6078">table beside it · one extension lead</text>
  </g>
</svg>
