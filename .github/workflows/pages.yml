name: Test, build, and deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ci/requirements.txt
      - run: pip install -c ci/requirements.txt ".[cards]"
      - run: python -m unittest discover -s tests -v
      - run: gw-piano --output dist
      - name: Build printable landmark fact cards
        # Downloads about 0.5 GB of GWOSC strain into a temporary directory and discards it.
        run: python scripts/fact_cards.py --output dist/landmark-fact-cards.pdf
      - name: Check sound pack before deploying
        run: python scripts/check_pack.py dist
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
